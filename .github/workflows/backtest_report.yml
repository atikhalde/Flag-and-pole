name: Backtest report (PDF)

# Manual run from the Actions tab (Actions -> "Backtest report (PDF)" -> Run workflow).
# Produces backtest_report.pdf + CSVs and uploads them as a downloadable artifact
# (and commits the PDF to reports/).
#
# It can also run on a schedule: uncomment the two lines below to get a fresh PDF on the
# 1st of every month at 02:30 UTC. A scheduled run uses the input defaults.
on:
  # schedule:
  #   - cron: "30 2 1 * *"
  workflow_dispatch:
    inputs:
      start:
        description: "history start date (YYYY-MM-DD)"
        type: string
        default: "2016-01-01"
      limit:
        description: "cap the universe size (0 = full filtered NSE list)"
        type: string
        default: "0"
      trigger:
        description: "which entry rule(s) to test"
        type: choice
        default: both
        options: [both, rail_reclaim, first_bullish]
      commit_pdf:
        description: "commit the PDF into reports/ (so it is browsable in the repo)"
        type: boolean
        default: true

concurrency:
  group: backtest-report
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r nse_scanner/requirements.txt

      - name: Refresh universe + market caps
        run: python3 -m nse_scanner.refresh_universe
        continue-on-error: true

      - name: Validate the detector against the two source charts
        run: python3 -m nse_scanner.tests.test_exemplars

      - name: Run backtest + build PDF
        env:
          BACKTEST_START: ${{ inputs.start }}
        run: |
          LIMIT="${{ inputs.limit }}"; [ "$LIMIT" = "0" ] && LIMIT=""
          python3 -m nse_scanner.backtest \
            ${LIMIT:+--limit $LIMIT} \
            --start "${{ inputs.start }}" \
            --trigger "${{ inputs.trigger }}" \
            --pdf --out reports

      - name: The classic book (one entry per setup, no re-basing) for the gate statistics
        run: |
          REBASE_ON_NEW_LOW=0 python3 -m nse_scanner.backtest \
            --out reports/classic --trigger first_bullish --start 2016-01-01
        continue-on-error: true

      - name: Filter study (which conditions actually remove the false signals)
        run: |
          python3 -m nse_scanner.filter_study \
            --csv reports/classic/backtest_trades.csv \
            --mode first_bullish \
            --out reports
        continue-on-error: true

      - name: Accuracy / returns / edge study (permutation test, same-risk benchmark)
        run: |
          python3 -m nse_scanner.edge_study \
            --csv reports/backtest_trades.csv \
            --classic-csv reports/classic/backtest_trades.csv \
            --out reports --n-boot 5000 --n-perm 1000
        continue-on-error: true

      - name: Rebuild summary + PDF from the CSV (picks up both studies, ~10 s)
        run: python3 -m nse_scanner.backtest --from-csv reports/backtest_trades.csv --out reports
        continue-on-error: true

      - name: Verify the run produced its artifacts (a silent gap is a failure)
        run: |
          python3 - <<'PYEOF'
          import json, os, sys
          need = ["reports/backtest_trades.csv", "reports/backtest_summary.json",
                  "reports/backtest_report.pdf", "reports/filter_study.json",
                  "reports/edge_study.json", "reports/classic/backtest_trades.csv"]
          bad = [p for p in need if not os.path.exists(p) or os.path.getsize(p) < 500]
          es = json.load(open("reports/edge_study.json")) if os.path.exists("reports/edge_study.json") else {}
          if not es.get("classic_trades"):
              bad.append("edge_study.json has no classic basis - the gate statistics would be invalid")
          if not (es.get("returns", {}).get("equity_fixed")):
              bad.append("edge_study.json has no fixed-risk equity block")
          fs = json.load(open("reports/filter_study.json")) if os.path.exists("reports/filter_study.json") else {}
          if not fs.get("baseline"):
              bad.append("filter_study.json has no baseline - the study did not finish")
          # the rebuild step is allowed to fail (so a broken report still leaves artifacts), which means
          # a silently stale PDF would otherwise pass every check above.  A PDF older than the studies it
          # is supposed to contain is a failed report, not a passing one.
          import os as _os
          _pdf = "reports/backtest_report.pdf"
          for _dep in ("reports/filter_study.json", "reports/edge_study.json"):
              if _os.path.getmtime(_pdf) < _os.path.getmtime(_dep):
                  bad.append(f"{_pdf} is older than {_dep} - the rebuild never picked the study up")
          if bad:
              print("MISSING OR EMPTY:")
              for b in bad:
                  print("  -", b)
              sys.exit(1)
          print("all artifacts present:", ", ".join(need))
          import pandas as _pd
          t = _pd.read_csv("reports/backtest_trades.csv")
          last = str(t.entry_date.max())[:10]
          print(f"newest trade entry date in the data: {last}")
          import datetime as _dt
          age = (_dt.date.today() - _dt.date.fromisoformat(last)).days
          if age > 7:
              print(f"::warning::the newest daily bar is {age} days old - the vendor feed may be lagging")
          PYEOF

      - name: Show summary
        run: |
          echo "==== summary ===="
          cat reports/backtest_summary.json || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: backtest-${{ github.run_number }}
          path: |
            reports/backtest_report.pdf
            reports/backtest_trades.csv
            reports/backtest_open_trades.csv
            reports/backtest_summary.json
            reports/filter_scan.csv
            reports/filter_study.json
            reports/edge_study.json
            reports/classic/backtest_trades.csv
          retention-days: 90

      - name: Commit PDF + trades
        if: ${{ inputs.commit_pdf }}
        run: |
          git config user.name  "flags-scanner-bot"
          git config user.email "flags-scanner-bot@users.noreply.github.com"
          git add reports nse_scanner/universe 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "backtest report $(date -u +'%Y-%m-%d')"
            for i in 1 2 3; do
              git pull --rebase --autostash origin ${GITHUB_REF_NAME} && git push && break
              echo "push attempt $i failed, retrying…"; sleep 5
            done
          fi
